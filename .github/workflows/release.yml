name: Release

on:
  push:
    tags:
      - 'v*'
  # One button, from main: builds the current commit as a rolling "dev" prerelease.
  # The version string is dev-<short sha>, so a dev build's report can never be
  # mistaken for a release in someone's screenshot.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Record Go version
        id: goversion
        run: echo "version=$(go version)" >> "$GITHUB_OUTPUT"

      - name: Decide version and tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace the previous dev prerelease
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete dev --cleanup-tag --yes || true

      - name: Build release binaries
        env:
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          build() {
            local goos="$1" goarch="$2" ext="$3"
            local name="pet-passport-${TAG}-${goos}-${goarch}${ext}"
            echo "Building ${name}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.passportVersion=${TAG}" \
              -o "dist/${name}" .
          }

          build windows amd64 .exe
          build linux amd64 ""
          build darwin arm64 ""

          ( cd dist && sha256sum * > SHA256SUMS )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          name: ${{ steps.meta.outputs.version }}
          files: dist/*
          body: |
            Built with `${{ steps.goversion.outputs.version }}`. Anyone rebuilding this
            tag with the same Go version and the command below should reproduce
            byte-identical binaries:

            ```
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.passportVersion=${{ steps.meta.outputs.version }}"
            ```

            Verify a downloaded binary against `SHA256SUMS` before running it:

            ```
            sha256sum -c SHA256SUMS                     # Linux/macOS
            Get-FileHash <file> -Algorithm SHA256        # Windows PowerShell
            ```
